<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शिक्षक सहायक (AI)</title>
    <!-- Tailwind CSS (UI) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSPDF (PDF Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Marked (For Markdown AI response formatting) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap');
        body { font-family: 'Mukta', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 3px solid #2563eb; color: #2563eb; background-color: rgba(37,99,235,0.05); }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col relative">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-lg z-10">
        <div>
            <h1 class="text-xl font-bold tracking-wide">शिक्षक सहायक</h1>
            <p class="text-xs text-blue-200">AI Lesson Plan Generator</p>
        </div>
        <button onclick="clearKey()" class="text-xs bg-blue-700 px-3 py-1 rounded border border-blue-500 hover:bg-red-500 transition">
            Key Reset
        </button>
    </header>

    <!-- Main Scrollable Area -->
    <main class="flex-grow overflow-y-auto p-4 pb-20">
        
        <!-- GENERATOR TAB -->
        <section id="view-create">
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500">कक्षा (Class)</label>
                        <select id="grade" class="w-full p-2 border rounded mt-1 bg-gray-50">
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">पाठ (Unit)</label>
                        <input type="text" id="unit" placeholder="Unit 1" class="w-full p-2 border rounded mt-1">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500">विषय / पाठको नाम (Lesson/Topic)</label>
                    <input type="text" id="topic" placeholder="जस्तै: बल (Force)" class="w-full p-2 border rounded mt-1">
                </div>

                <button onclick="generatePlan()" id="btn-generate" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold shadow-md active:transform active:scale-95 transition flex justify-center items-center gap-2">
                    <span id="btn-text">पाठ योजना तयार गर्नुहोस्</span>
                    <!-- Spinner Icon (Hidden by default) -->
                    <svg id="loading-spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                </button>
            </div>

            <!-- RESULT CARD (Shows after generation) -->
            <div id="result-card" class="hidden mt-5 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-50 px-4 py-2 border-b flex justify-between items-center">
                    <h3 class="font-bold text-gray-700">उत्पादित योजना</h3>
                </div>
                
                <div id="ai-output" class="p-4 text-sm leading-relaxed text-gray-800 h-96 overflow-y-auto"></div>
                
                <div class="grid grid-cols-2">
                    <button onclick="saveToHistory()" class="bg-green-600 text-white p-3 hover:bg-green-700 border-r border-green-700 font-medium">
                         Save App
                    </button>
                    <button onclick="exportToPdf()" id="pdf-btn" class="bg-red-600 text-white p-3 hover:bg-red-700 font-medium flex justify-center items-center gap-2">
                        <span>Save PDF</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- HISTORY TAB (Hidden) -->
        <section id="view-history" class="hidden">
            <h2 class="text-lg font-bold mb-4 text-gray-700 px-1">तपाईंको अभिलेख (History)</h2>
            <div id="history-list" class="space-y-3">
                <!-- Javascript will insert history items here -->
                <p class="text-center text-gray-500 mt-10">कुनै रेकर्ड फेला परेन।</p>
            </div>
        </section>
    </main>

    <!-- Navigation Bottom Bar -->
    <nav class="bg-white border-t border-gray-200 flex fixed bottom-0 w-full z-10">
        <button onclick="switchView('create')" id="nav-create" class="flex-1 py-3 text-center font-bold text-gray-600 tab-btn active">
            नयाँ (New)
        </button>
        <button onclick="switchView('history')" id="nav-history" class="flex-1 py-3 text-center font-bold text-gray-600 tab-btn">
            अभिलेख (Saved)
        </button>
    </nav>

    <!-- API Key Modal -->
    <div id="api-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
            <h3 class="text-lg font-bold text-gray-900 mb-2">API Setup</h3>
            <p class="text-xs text-gray-600 mb-4">यो एप चलाउनको लागि नि:शुल्क Gemini API Key चाहिन्छ।</p>
            <input type="password" id="api-input" placeholder="Paste your AI Studio Key here..." class="w-full p-3 border border-gray-300 rounded mb-4 text-sm focus:border-blue-500 focus:outline-none">
            <div class="flex justify-end gap-3">
                <button onclick="window.location.href='https://aistudio.google.com/app/apikey'" class="text-blue-600 text-xs font-bold underline py-2">Get Free Key</button>
                <button onclick="saveApiKey()" class="bg-blue-700 text-white px-5 py-2 rounded-lg font-bold text-sm">Start App</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
